# Builds the Android app (APK) in the cloud on every push to main, or on demand.
# The APK is published on the repository's Releases page as "Pontual (última versão)".
name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check Supabase secrets
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ] || [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "::error::Cadastre os secrets VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Text-free splash (logo on light background)
        working-directory: app/android/app/src/main/res
        run: |
          find . -name splash.png -delete
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
            '<layer-list xmlns:android="http://schemas.android.com/apk/res/android">' \
            '  <item android:drawable="@color/splash_background"/>' \
            '  <item android:width="144dp" android:height="144dp" android:gravity="center" android:drawable="@mipmap/ic_launcher"/>' \
            '</layer-list>' > drawable/splash.xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources><color name="splash_background">#F5F6F8</color></resources>' > values/splash_colors.xml

      - name: Build signed APK
        working-directory: app/android
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ ! -f keystore.p12.enc ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Falta a chave de assinatura. Cadastre o secret ANDROID_KEY_PASSWORD e rode uma vez o workflow 'Criar chave de assinatura (uma vez)'."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in keystore.p12.enc \
            -out "$RUNNER_TEMP/ks.p12" -pass env:ANDROID_KEY_PASSWORD
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/ks.p12"
          ./gradlew assembleRelease --no-daemon
          rm "$RUNNER_TEMP/ks.p12"
          cp app/build/outputs/apk/release/app-release.apk ../../Pontual.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pontual-apk
          path: Pontual.apk

      - name: Publish on Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Pontual - Sistema para Clínicas (última versão)
          body: |
            Versão 1.0.${{ github.run_number }}.
            Baixe o arquivo **Pontual.apk** abaixo no celular Android e instale.
            Quem já tem o app instalado só precisa instalar por cima: os dados ficam na nuvem.
          files: Pontual.apk
          make_latest: true
