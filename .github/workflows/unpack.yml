# How updates arrive: upload vetcare.zip through the GitHub website (Add file > Upload files).
# This workflow unpacks it into the repository; "Publicar" then runs by itself.
# (Workflow files in .github/ are not touched: GitHub does not allow it from here.)
name: Aplicar atualização (zip)

on:
  push:
    paths: ['vetcare.zip']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip into repository
        run: |
          test -f vetcare.zip || { echo "vetcare.zip não encontrado"; exit 0; }
          unzip -q vetcare.zip -d "$RUNNER_TEMP/x"
          rsync -a --exclude .github "$RUNNER_TEMP/x/vetcare/" ./
          git rm -q vetcare.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Atualização do projeto (zip)"
          git push
