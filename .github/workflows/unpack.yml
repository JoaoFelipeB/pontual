# Run once: unpacks vetcare.zip (uploaded through the web) into the repository.
# GitHub does not let this token write workflow files, so .github/ is added separately.
name: Desempacotar projeto (uso único)

on:
  push:
    paths: ['vetcare.zip']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip into repository
        run: |
          test -f vetcare.zip || { echo "vetcare.zip não encontrado"; exit 0; }
          unzip -q vetcare.zip -d "$RUNNER_TEMP/x"
          rsync -a --exclude .github "$RUNNER_TEMP/x/vetcare/" ./
          git rm -q vetcare.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Projeto VetCare"
          git push
