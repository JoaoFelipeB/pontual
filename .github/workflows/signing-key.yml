# Run ONCE: creates the key that signs every version of the Android app.
# The key is stored in the repository encrypted with the ANDROID_KEY_PASSWORD
# secret; without that password it is useless. Never delete the secret: a new
# key would force everyone to uninstall the app before updating.
name: Criar chave de assinatura (uma vez)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check prerequisites
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f app/android/keystore.p12.enc ]; then
            echo "::error::A chave já existe (app/android/keystore.p12.enc). Não crie outra: os celulares não conseguiriam atualizar o app."
            exit 1
          fi
          if [ ${#ANDROID_KEY_PASSWORD} -lt 16 ]; then
            echo "::error::Cadastre o secret ANDROID_KEY_PASSWORD com pelo menos 16 caracteres antes de rodar."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate and encrypt key
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$RUNNER_TEMP/ks.p12" -alias vetcare \
            -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=VetCare, O=VetCare, C=BR" \
            -storepass "$ANDROID_KEY_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD"
          openssl enc -aes-256-cbc -pbkdf2 -iter 300000 -salt \
            -in "$RUNNER_TEMP/ks.p12" -out app/android/keystore.p12.enc -pass env:ANDROID_KEY_PASSWORD
          rm "$RUNNER_TEMP/ks.p12"

      - name: Commit encrypted key
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/android/keystore.p12.enc
          git commit -m "chore: add encrypted Android signing key"
          git push
